name: ForgeLoop CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
          cache: pip
      - name: Install full analysis and test dependencies
        run: python -m pip install '.[analysis,dev]' build
      - name: Require analysis runtime
        run: forgeloop doctor --require-analysis
      - name: Test all features
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Reject skipped tests
        run: python scripts/check_test_report.py test-results.xml
      - name: Exercise saved experiment workflow
        run: |
          forgeloop analyze examples/synthetic-flight.csv --transcript examples/synthetic-transcript.md --id CI-001 --hypothesis 'Exercise pipeline' --strategy 'Synthetic fixture' --decision ACCEPT --reason 'Test only' --build-mode Copilot --evidence-kind synthetic --reference-duration 120
          forgeloop list --evidence-kind synthetic
          forgeloop dashboard --evidence-kind synthetic --output site
      - name: Build distribution
        run: python -m build
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t forgeloop:ci .
      - run: docker run --rm --network none forgeloop:ci doctor --require-analysis
      - run: docker run --rm --network none forgeloop:ci catalog rocket
